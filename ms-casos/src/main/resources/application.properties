spring.application.name=ms-casos

spring.profiles.active=dev
spring.jpa.open-in-view=false

server.port=0
server.forward-headers-strategy=framework

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=10

server.error.include-message=always
server.error.include-stacktrace=never

spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=5000

resilience4j.circuitbreaker.instances.alunos.slidingWindowSize=3
resilience4j.circuitbreaker.instances.alunos.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.alunos.minimumNumberOfCalls=2
resilience4j.circuitbreaker.instances.alunos.failureRateThreshold=50
resilience4j.circuitbreaker.instances.alunos.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.alunos.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.alunos.recordExceptions=feign.FeignException

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
