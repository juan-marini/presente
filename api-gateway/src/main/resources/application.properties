spring.application.name=api-gateway

server.port=8082

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.server.webflux.routes[0].id=ms-alunos
spring.cloud.gateway.server.webflux.routes[0].uri=lb://ms-alunos
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/alunos/**

spring.cloud.gateway.server.webflux.routes[1].id=ms-casos
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ms-casos
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/casos/**
